name: eye_health
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rename_app: ^1.6.1
  nb_utils: ^7.1.4
  camera: ^0.10.6
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  http: ^1.2.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.1.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path_ios: "assets/icons/launcher_icon.png"
  image_path_android: "assets/icons/launcher_icon.png"
  adaptive_icon_foreground: "assets/icons/launcher_icon.png"
  ios: true
  android: true
  adaptive_icon_background: "#ffffff"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/


